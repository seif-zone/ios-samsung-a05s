# device.conf: Samsung Galaxy A05s (SM-A057F / m269) device specification
# Compatible with HakiOS device repository standard (tools/hakios-device.py)
# Documentation: https://hackios-web.vercel.app/en/docs/devices

device a057f
	title       Samsung Galaxy A05s
	vendor      Samsung
	soc         sm6225
	motherboard m269
	defconfig   a057f_defconfig
	firmware    pull-firmware.sh
	maintainer  seif-zone (https://github.com/seif-zone/ios-samsung-a05s)
	status      display     works     1080x2400 @ 32bpp splash framebuffer at 0x5c000000; Topaz framebuffer scanout
	status      touch       partial   Novatek NT36672C / Goodix I2C touchscreen on QUP0 (touchscreen=1)
	status      buttons     works     Power and Volume Up/Down keys mapped via PM6125 GPIO
	status      cpu         works     4x Kryo 260 Gold (Cortex-A73) via PSCI CPU_ON(0x100); Silver parked (TGran16 workaround)
	status      gpu         partial   Adreno 610 (a6xx PM4 command processor, hakios-metal probe compatible, gpu=1)
	status      storage     works     MockFS ramdisk root (/dev/md0, rd=md0); eMMC 5.1 sdhci@7804000
	status      audio       partial   I2S amplifier routing via Qualcomm bengal audio DSP
	status      battery     works     SM5602 fuel gauge on QUP0 SE2 (0x04a88000), battery=1
	status      haptic      partial   A05s ERM vibration motor via PMIC GPIO
	status      camera      missing   Samsung ISOCELL JN1 (50MP) / GC02M1 sensors; needs camera HAL glue
	status      torch       works     PM6125 flash LED toggle via flashlight driver
	status      wifi        missing   Qualcomm WCN3950 Wi-Fi (ath10k driver port in progress)
	status      bluetooth   missing   WCN3950 Bluetooth UART HCI
	status      cellular    missing   modem disabled in safe carve-out boundary (modem=0)
	status      thermal     partial   SM6225 tsens sensors monitored at 0x015c0000 (thermal=1)
